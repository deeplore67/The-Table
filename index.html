<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section id="gate" class="card">
      <div class="logo">T</div>
      <h1>The Table</h1>
      <p class="muted">A private place for invited people to talk.</p>

      <label for="invite">Invitation code</label>
      <input id="invite" type="text" autocomplete="off" placeholder="Enter your invite code">

      <label for="username">Username</label>
      <input id="username" type="text" maxlength="24" autocomplete="off" placeholder="Choose a username">

      <button id="enterBtn">Enter The Table</button>
      <p id="gateMsg" class="message"></p>
      <small class="muted">Use a nickname. Don't post personal information or illegal/harmful content.</small>
    </section>

    <section id="app" class="app hidden">
      <header class="topbar">
        <div>
          <h1>The Table</h1>
          <span id="roomLabel" class="muted">Main room</span>
        </div>
        <button id="leaveBtn" class="ghost">Leave</button>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="composer" class="composer">
        <input id="messageInput" maxlength="1000" autocomplete="off"
               placeholder="Say something…">
        <button type="submit">Send</button>
      </form>

      <p id="appMsg" class="message"></p>
    </section>
  </main>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabse
    -js@2"></script>
  <script src="app.js"></script>
</body>
</html>
